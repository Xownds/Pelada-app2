<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pelada App</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#07140d;
  color:white;
  font-family:Arial, sans-serif;
  min-height:100vh;
  padding:15px;
  overscroll-behavior-y: contain;
}

h1{
  text-align:center;
  margin-bottom:20px;
  color:#32ff7e;
}

.container{
  max-width:1200px;
  margin:auto;
}

.card{
  background:#0d2015;
  border:1px solid #1f4d35;
  border-radius:20px;
  padding:15px;
  margin-bottom:20px;
  box-shadow:0 0 15px rgba(0,255,100,.1);
}

.inputs{
  display:flex;
  flex-direction:column;
  gap:10px;
}

input,select{
  padding:12px;
  border:none;
  border-radius:12px;
  background:#13281c;
  color:white;
  font-size:15px;
}

button{
  padding:12px;
  border:none;
  border-radius:12px;
  background:#32ff7e;
  color:#04110a;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:scale(1.03);
}

.players-list{
  display:grid;
  gap:10px;
}

.player-card{
  background:#13281c;
  border-radius:15px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  animation:fade .3s;
}

.player-info{
  display:flex;
  flex-direction:column;
}

.player-actions{
  display:flex;
  gap:5px;
}

.small-btn{
  padding:8px 10px;
  font-size:12px;
}

.delete{
  background:#ff4d4d;
  color:white;
}

.edit{
  background:#ffd32a;
}

.field-container{
  display:grid;
  grid-template-columns:1fr;
  gap:20px;
}

.field{
  background:#0b2b16;
  border:3px solid #32ff7e;
  border-radius:20px;
  min-height:650px;
  padding:10px;
  position:relative;
  overflow:hidden;

  background-size:100% 100%;
  box-shadow: inset 0 0 40px rgba(0,0,0,.5);
}

.field::before{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  height:3px;
  background:rgba(255,255,255,.2);
}

.field::after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border:3px solid rgba(255,255,255,.2);
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.field .goal{
  position:absolute;
  width:120px;
  height:8px;
  background:white;
  left:50%;
  transform:translateX(-50%);
}

.field .goal.top{
  top:5px;
}

.field .goal.bottom{
  bottom:5px;
}

.field .box{
  position:absolute;
  width:180px;
  height:80px;
  border:3px solid rgba(255,255,255,.25);
  left:50%;
  transform:translateX(-50%);
}

.field .box.top{
  top:0;
}

.field .box.bottom{
  bottom:0;
}

.field h2{
  text-align:center;
  margin-bottom:10px;
}

.positions{
  display:flex;
  flex-direction:column;
  gap:12px;
  position:relative;
  z-index:2;
}

.line{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.slot{z-index:10;
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  border:2px dashed rgba(255,255,255,.3);
  background:rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:11px;
  padding:5px;
  cursor:pointer;
  transition:.2s;
  transform:translate(-50%,-50%);
  font-weight:bold;
}

.slot:hover{
  background:rgba(255,255,255,.1);
}

.filled{
  background:#32ff7e;
  color:black;
  border:none;
  font-weight:bold;
}

.top-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.counter{
  margin-top:10px;
  color:#32ff7e;
  font-weight:bold;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-content{
  background:#102318;
  width:90%;
  max-height:80vh;
  overflow:auto;
  padding:20px;
  border-radius:20px;
}

.modal-player{
  background:#163320;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  cursor:pointer;
}

.modal-player:hover{
  background:#1e472d;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(min-width:900px){
  .field-container{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>⚽ Pelada App</h1>

<div class="card">

<div class="inputs">

<input type="text" id="name" placeholder="Nome do jogador">

<input type="number" id="number" placeholder="Número da camisa">

<select id="position">
<option value="Goleiro">Goleiro</option>
<option value="Zagueiro">Zagueiro</option>
<option value="Lateral">Lateral</option>
<option value="Volante">Volante</option>
<option value="Meia">Meia</option>
<option value="Atacante">Atacante</option>
</select>

<button onclick="addPlayer()">Adicionar Jogador</button>

</div>

<div class="counter" id="counter">
0 / 22 jogadores
</div>

</div>

<div class="card">

<div class="top-buttons">
<button onclick="drawTeams()">🎲 Sortear Times</button>
<button onclick="clearTeams()">🧹 Limpar Times</button>
</div>

</div>

<div class="card">

<h2>Jogadores</h2>

<div class="players-list" id="playersList"></div>

</div>

<div class="field-container">

<div class="field">

  <div class="goal top"></div>
  <div class="goal bottom"></div>

  <div class="box top"></div>
  <div class="box bottom"></div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
  <h2>Time 1</h2>

  <select id="formationSelect" onchange="changeFormation()">
    <option value="433">4-3-3</option>
    <option value="442">4-4-2</option>
    <option value="352">3-5-2</option>
    <option value="532">5-3-2</option>
    <option value="451">4-5-1</option>
  </select>
</div>

<div class="positions" id="team1"></div>

</div>

<div class="field">

  <div class="goal top"></div>
  <div class="goal bottom"></div>

  <div class="box top"></div>
  <div class="box bottom"></div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
  <h2>Time 2</h2>

  <select id="formationSelect" onchange="changeFormation()">
    <option value="433">4-3-3</option>
    <option value="442">4-4-2</option>
    <option value="352">3-5-2</option>
    <option value="532">5-3-2</option>
    <option value="451">4-5-1</option>
  </select>
</div>

<div class="positions" id="team2"></div>

</div>

</div>

</div>

<div class="modal" id="modal">
<div class="modal-content">
<h2>Selecionar Jogador</h2>
<div id="modalPlayers"></div>
</div>
</div>

<script>
const maxPlayers = 22;

let players = JSON.parse(localStorage.getItem("players")) || [];

let teams = {
  team1: Array(11).fill(null),
  team2: Array(11).fill(null)
};

const formations = {

  "433":[
    {top:"90%",left:"50%"},
    {top:"72%",left:"20%"},
    {top:"72%",left:"40%"},
    {top:"72%",left:"60%"},
    {top:"72%",left:"80%"},
    {top:"50%",left:"30%"},
    {top:"50%",left:"50%"},
    {top:"50%",left:"70%"},
    {top:"25%",left:"25%"},
    {top:"20%",left:"50%"},
    {top:"25%",left:"75%"}
  ],

  "442":[
    {top:"90%",left:"50%"},
    {top:"72%",left:"20%"},
    {top:"72%",left:"40%"},
    {top:"72%",left:"60%"},
    {top:"72%",left:"80%"},
    {top:"50%",left:"20%"},
    {top:"50%",left:"40%"},
    {top:"50%",left:"60%"},
    {top:"50%",left:"80%"},
    {top:"25%",left:"35%"},
    {top:"25%",left:"65%"},
  ],  
"352":[
  {top:"90%",left:"50%"},
  {top:"70%",left:"30%"},
  {top:"70%",left:"50%"},
  {top:"70%",left:"70%"},
  {top:"50%",left:"15%"},
  {top:"50%",left:"35%"},
  {top:"50%",left:"50%"},
  {top:"50%",left:"65%"},
  {top:"50%",left:"85%"},
  {top:"25%",left:"35%"},
  {top:"25%",left:"65%"}
],

"532":[
  {top:"90%",left:"50%"},
  {top:"72%",left:"10%"},
  {top:"72%",left:"30%"},
  {top:"72%",left:"50%"},
  {top:"72%",left:"70%"},
  {top:"72%",left:"90%"},
  {top:"50%",left:"30%"},
  {top:"50%",left:"50%"},
  {top:"50%",left:"70%"},
  {top:"25%",left:"35%"},
  {top:"25%",left:"65%"}
],

"451":[
  {top:"90%",left:"50%"},
  {top:"72%",left:"20%"},
  {top:"72%",left:"40%"},
  {top:"72%",left:"60%"},
  {top:"72%",left:"80%"},
  {top:"50%",left:"10%"},
  {top:"50%",left:"30%"},
  {top:"50%",left:"50%"},
  {top:"50%",left:"70%"},
  {top:"50%",left:"90%"},
  {top:"25%",left:"50%"}
]
  ]

};

let currentFormation = "433";
 
let currentSlot = null;

function savePlayers(){
  localStorage.setItem("players", JSON.stringify(players));
}

function updateCounter(){
  document.getElementById("counter").innerText =
  `${players.length} / 22 jogadores`;
}

function addPlayer(){

  if(players.length >= maxPlayers){
    alert("Limite máximo de 22 jogadores.");
    return;
  }

  const name = document.getElementById("name").value.trim();
  const number = document.getElementById("number").value.trim();
  const position = document.getElementById("position").value;

  if(!name || !number){
    alert("Preencha os campos.");
    return;
  }

  players.push({
    id: Date.now(),
    name,
    number,
    position
  });

  savePlayers();
  renderPlayers();

  document.getElementById("name").value = "";
  document.getElementById("number").value = "";
}

function renderPlayers(){

  updateCounter();

  const list = document.getElementById("playersList");

  list.innerHTML = "";

  players.forEach(player => {

    const div = document.createElement("div");

    div.className = "player-card";

    div.innerHTML = `
      <div class="player-info">
        <strong>${player.name}</strong>
        <span>Camisa ${player.number}</span>
        <span>${player.position}</span>
      </div>

      <div class="player-actions">
        <button class="small-btn edit"
        onclick="editPlayer(${player.id})">
        Editar
        </button>

        <button class="small-btn delete"
        onclick="deletePlayer(${player.id})">
        Excluir
        </button>
      </div>
    `;

    list.appendChild(div);

  });

}

function deletePlayer(id){

  players = players.filter(p => p.id !== id);

  savePlayers();
  renderPlayers();

}

function editPlayer(id){

  const player = players.find(p => p.id === id);

  const newName = prompt("Novo nome", player.name);

  if(newName === null) return;

  const newNumber = prompt("Novo número", player.number);

  if(newNumber === null) return;

  player.name = newName;
  player.number = newNumber;

  savePlayers();
  renderPlayers();
  renderTeams();

}

function renderTeams(){

  renderSingleTeam("team1");
  renderSingleTeam("team2");

}

function renderSingleTeam(teamName){

  const container = document.getElementById(teamName);

  container.innerHTML = "";

  for(let index = 0; index < 11; index++){

    const slot = document.createElement("div");

    slot.className = "slot";

    const pos = formations[currentFormation][index];

    slot.style.top = pos.top;
    slot.style.left = pos.left;

    const player = teams[teamName][index];

    if(player){

      slot.classList.add("filled");

      slot.innerHTML = `
        ${player.name}<br>
        #${player.number}
      `;

    }else{

      slot.innerHTML = `+`;

    }

    slot.onclick = () => openModal(teamName,index);

    container.appendChild(slot);

  }

}

 
function openModal(team,index){

  currentSlot = {team,index};

  const modal = document.getElementById("modal");
  const modalPlayers = document.getElementById("modalPlayers");

  modalPlayers.innerHTML = "";

  const usedIds = [
    ...teams.team1,
    ...teams.team2
  ]
  .filter(Boolean)
  .map(p => p.id);

  players.forEach(player => {

    if(usedIds.includes(player.id)) return;

    const div = document.createElement("div");

    div.className = "modal-player";

    div.innerHTML = `
      <strong>${player.name}</strong><br>
      Camisa ${player.number} • ${player.position}
    `;

    div.onclick = () => {

      teams[team][index] = player;

      renderTeams();

      closeModal();

    };

    modalPlayers.appendChild(div);

  });

  modal.style.display = "flex";

}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

window.onclick = function(e){

  const modal = document.getElementById("modal");

  if(e.target === modal){
    closeModal();
  }

}

function clearTeams(){

  teams.team1 = Array(11).fill(null);
  teams.team2 = Array(11).fill(null);

  renderTeams();

}

function shuffle(array){

  for(let i = array.length - 1; i > 0; i--){

    const j = Math.floor(Math.random() * (i + 1));

    [array[i],array[j]] = [array[j],array[i]];

  }

}

function drawTeams(){

  if(players.length < 22){
    alert("Cadastre 22 jogadores.");
    return;
  }

  clearTeams();

  const shuffled = [...players];

  shuffle(shuffled);

  teams.team1 = shuffled.slice(0,11);
  teams.team2 = shuffled.slice(11,22);

  renderTeams();

}
function changeFormation(){

  currentFormation =
  document.getElementById("formationSelect").value;

  renderTeams();

}
renderPlayers();
renderTeams();
</script>

</body>
</html>
