<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pelada App</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:
linear-gradient(
180deg,
#06110b 0%,
#0d2015 100%
);
  color:white;
  font-family:Arial, sans-serif;
  min-height:100vh;
  padding:15px;
  overscroll-behavior-y: contain;
}

h1{
  text-align:center;
  color:#32ff7e;
  margin-bottom:10px;
}

#modeLabel{
  text-align:center;
  color:#32ff7e;
  margin-bottom:20px;
  opacity:.8;
}
.container{
  max-width:1200px;
  margin:auto;
}

.card{
 background:rgba(15,35,24,.95);
backdrop-filter:blur(10px);
  border:1px solid #1f4d35;
  border-radius:20px;
  padding:15px;
  margin-bottom:20px;
  box-shadow:0 0 15px rgba(0,255,100,.1);
}

.inputs{
  display:flex;
  flex-direction:column;
  gap:10px;
}

input,select{
  padding:12px;
  border:none;
  border-radius:12px;
  background:#13281c;
  color:white;
  font-size:15px;
}

button{
  padding:12px;
  border:none;
  border-radius:12px;
  background:#32ff7e;
  color:#04110a;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:scale(1.03);
}

.players-list{
  display:grid;
  gap:10px;
}

.player-card{
  background:#13281c;
  border-radius:15px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  animation:fade .3s;
}

.player-info{
  display:flex;
  flex-direction:column;
}

.player-actions{
  display:flex;
  gap:5px;
}

.small-btn{
  padding:8px 10px;
  font-size:12px;
}

.delete{
  background:#ff4d4d;
  color:white;
}

.edit{
  background:#ffd32a;
}

.field-container{
  display:grid;
  grid-template-columns:1fr;
  gap:20px;
}

.field{
background-image:
linear-gradient(
to bottom,
rgba(255,255,255,.03) 1px,
transparent 1px
);

background-size:100% 40px;
 background-color:#0b2b16;
  border:3px solid #32ff7e;
  border-radius:20px;
  min-height:650px;
  padding:10px;
  position:relative;
  overflow:hidden;

  background-size:100% 100%;
  box-shadow: inset 0 0 40px rgba(0,0,0,.5);
}

.field::before{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  height:3px;
  background:rgba(255,255,255,.2);
}

.field::after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border:3px solid rgba(255,255,255,.2);
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.field .goal{
  position:absolute;
  width:120px;
  height:8px;
  background:white;
  left:50%;
  transform:translateX(-50%);
}

.field .goal.top{
  top:5px;
}

.field .goal.bottom{
  bottom:5px;
}

.field .box{
  position:absolute;
  width:180px;
  height:80px;
  border:3px solid rgba(255,255,255,.25);
  left:50%;
  transform:translateX(-50%);
}

.field .box.top{
  top:0;
}

.field .box.bottom{
  bottom:0;
}

.field h2{
  text-align:center;
  margin-bottom:10px;
}

.positions{
  position:relative;
  width:100%;
  height:100%;
  min-height:650px;
}

.line{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.slot{display:flex;
flex-direction:column;
gap:2px;

transition:
all .45s cubic-bezier(.2,.8,.2,1);z-index:10;
  position:absolute;
 width:58px;
height:58px;
  border-radius:50%;
  border:2px dashed rgba(255,255,255,.3);
  background:rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:11px;
  padding:5px;
  cursor:pointer;
  transform:translate(-50%,-50%);
  font-weight:bold;
}

.slot:hover{
  background:rgba(255,255,255,.1);
}

.filled{
  box-shadow:0 0 15px rgba(50,255,126,.6);
  background:#32ff7e;
  color:black;
  border:none;
  font-weight:bold;
}
.slot.filled:hover{
  transform:
  translate(-50%,-50%)
  scale(1.12);

  z-index:999;
}
.shirt{
  width:42px;
  height:46px;

  background:
  linear-gradient(
    180deg,
    #49ff93,
    #19c963
  );

  border-radius:
  10px 10px 14px 14px;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;
  font-weight:900;
  font-size:15px;

  box-shadow:
  0 4px 15px rgba(0,0,0,.45);

  border:
  2px solid rgba(255,255,255,.15);

  overflow:hidden;
}.shirt::before,
.shirt::after{
  content:"";
  position:absolute;
  width:12px;
  height:14px;
  background:inherit;
  top:4px;
  border-radius:5px;
}

.shirt::before{
  left:-6px;
}

.shirt::after{
  right:-6px;
}
.captain-shirt{
  box-shadow:
  0 0 20px rgba(255,215,0,.95),
  0 0 40px rgba(255,215,0,.45);

  transform:scale(1.12);
}
.player-name{
  font-size:9px;
  font-weight:700;
  max-width:70px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  text-shadow:0 2px 5px rgba(0,0,0,.5);
}
  
.top-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.counter{
  margin-top:10px;
  color:#32ff7e;
  font-weight:bold;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-content{
  background:#102318;
  width:90%;
  max-height:80vh;
  overflow:auto;
  padding:20px;
  border-radius:20px;
}

.modal-player{
  background:#163320;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  cursor:pointer;
}

.modal-player:hover{
  background:#1e472d;
}
.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.tabs button{
  flex:1;
}
@keyframes fade{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(min-width:900px){
  .field-container{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

  if(newNumber === null) return;

  player.name = newName;

  renderPlayers();

  currentSlot = {team,index};

  const modal = document.getElementById("modal");
  const modalPlayers = document.getElementById("modalPlayers");

  modalPlayers.innerHTML = "";

  let usedPlayers = [];

for(
  let i = 1;
  i <= totalTeams;
  i++
){

  usedPlayers.push(
    ...teamsByMode[gameMode]
    [`team${i}`]
  );

}

const usedIds =
usedPlayers
.filter(Boolean)
.map(p => p.id);

  players.forEach(player => {

    if(usedIds.includes(player.id)) return;
    const div = document.createElement("div");

    div.className = "modal-player";

    div.innerHTML = `
    <strong>
${player.captain ? "🧠 " : ""}
${player.name}
</strong><br>
      Camisa ${player.number} • ${player.position}
    `;

    div.onclick = () => {

      teamsByMode[gameMode][team][index] =
player;

      renderTeams();

      closeModal();

    };

    modalPlayers.appendChild(div);

  });

  modal.style.display = "flex";

}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

window.onclick = function(e){

  const modal = document.getElementById("modal");

  if(e.target === modal){
    closeModal();
  }

}

function clearTeams(){

  const totalPlayers =
  formations[
    currentFormation.team1
  ].length;

  for(
    let i = 1;
    i <= totalTeams;
    i++
  ){

    teamsByMode[gameMode]
    [`team${i}`] =

    Array(totalPlayers)
    .fill(null);

  }

  renderTeams();

}

function shuffle(array){

  for(let i = array.length - 1; i > 0; i--){

    const j = Math.floor(Math.random() * (i + 1));

    [array[i],array[j]] = [array[j],array[i]];

  }

}

function drawTeams(){
  let minPlayers = 22;

if(gameMode === "society"){
  minPlayers = 14;
}

if(gameMode === "futsal"){
  minPlayers = 10;
}

if(players.length < minPlayers){

  alert(
    `Você precisa de no mínimo ${minPlayers} jogadores`
  );

  return;

}

  clearTeams();

  const available = [...players];

  shuffle(available);

 for(
  let t = 1;
  t <= totalTeams;
  t++
){

  const team =
  `team${t}`;

    const formation =
    currentFormation[team];

    const roles =
    formationRoles[formation];

    for(let i = 0; i < roles.length; i++){

      const role = roles[i];

      const playerIndex =
      available.findIndex(
        p => p.position === role
      );

      if(playerIndex !== -1){

 teamsByMode[gameMode][team][i] =
available[playerIndex];

        available.splice(playerIndex,1);

      }

    }

  }

  renderTeams();

}


function changeFormation(team){

const number =
team.replace("team","");

const select =
document.getElementById(
  `formationSelect${number}`
);

  currentFormation[team] = select.value;

  renderSingleTeam(team);

}
function toggleCaptain(id){

  players.forEach(p => p.captain = false);

  const player = players.find(p => p.id === id);

  player.captain = true;

  savePlayers();

  renderPlayers();
  renderTeams();

}
function showTab(tab){

  document.getElementById(
    "teamsTab"
  ).style.display = "none";

  document.getElementById(
    "playersTab"
  ).style.display = "none";

  document.getElementById(
    "modesTab"
  ).style.display = "none";

  document.getElementById(
    "settingsTab"
  ).style.display = "none";

  document.getElementById(
    tab + "Tab"
  ).style.display = "block";

}
let gameMode = "football";
let totalTeams = 2;
const modeConfig = {

  football:{
    players:11,
    formations:["433","442","352","532","451"]
  },

  society:{
    players:7,
    formations:["322","231","2121"]
  },

  futsal:{
    players:5,
    formations:["121","22","311"]
  }

};
function setMode(mode){

  gameMode = mode;

  const config =
  modeConfig[mode];

  const formationsList =
  config.formations;

  for(
    let i = 1;
    i <= 4;
    i++
  ){

    const select =
document.getElementById(
  `formationSelect${i}`
);

    if(!select) continue;

    select.innerHTML = "";

    formationsList.forEach(f => {

      select.innerHTML += `
        <option value="${f}">
          ${f}
        </option>
      `;

    });

    currentFormation[
      `team${i}`
    ] = formationsList[0];

    select.value =
    formationsList[0];

  }

  const modeLabel =
  document.getElementById(
    "modeLabel"
  );

  if(mode === "football"){
    modeLabel.innerHTML =
    "⚽ Modo Futebol";
  }

  if(mode === "society"){
    modeLabel.innerHTML =
    "🏟️ Modo Society";
  }

  if(mode === "futsal"){
    modeLabel.innerHTML =
    "🔥 Modo Futsal";
  }

  clearTeams();

  renderTeams();

}
  function setTeamsAmount(amount){

  totalTeams = amount;
document.getElementById(
  "field3"
).style.display =
amount >= 3
? "block"
: "none";

document.getElementById(
  "field4"
).style.display =
amount >= 4
? "block"
: "none";
  alert(
    `${amount} times ativados`
  );

}
  function resetApp(){

  if(confirm("Apagar todos os dados?")){

    localStorage.clear();

    players = [];

    clearTeams();

    renderPlayers();

  }

}
renderPlayers();
renderTeams();
